version: '3.5'

services:
  # Delta API
  delta:
    image: delta
    build:
      context: .
    container_name: delta_production
    tty: true
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    networks:
      - net

  # Delta Nginx
  nginx:
    image: nginx:alpine
    container_name: delta_nginx_production
    hostname: api
    tty: true
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www
      - ./config/conf.d:/etc/nginx/conf.d
    networks:
      - net

  postgres:
    image: postgres
    container_name: postgres_production
    build:
      dockerfile: Postgres
    hostname: db
    ports:
      - "5432:5432"
    networks:
      - net
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: passwd
      POSTGRES_DB: postgres
    restart: unless-stopped

networks:
  net:
    driver: bridge